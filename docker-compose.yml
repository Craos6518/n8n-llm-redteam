services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./data/n8n:/home/node/.n8n
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_EDITOR_BASE_URL=http://localhost:5678/
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Bogota
      - N8N_SECURE_COOKIE=false
    networks:
      - automatizacion_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # Solo CPU: AMD Radeon Vega 8 integrada NO soportada por ROCm (requiere GPU discreta RDNA/CDNA)
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=15m
    networks:
      - automatizacion_net
    deploy:
      resources:
        limits:
          memory: 7.5G
        reservations:
          memory: 4.5G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  discord-bridge:
    build: ./discord-bridge
    container_name: discord-bridge
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - automatizacion_net

networks:
  automatizacion_net:
    driver: bridge
    name: automatizacion_net

volumes: {}
